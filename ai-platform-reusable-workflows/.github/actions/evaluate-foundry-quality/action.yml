name: Microsoft Foundry managed evaluator gate (preview)
description: Runs a pre-approved Foundry eval.yaml and enforces a parsed pass-rate threshold.
inputs:
  config:
    required: true
    description: Evaluation config name located under agent's source root
  minimum-pass-rate:
    required: true
    description: Float between 0 and 1
runs:
  using: composite
  steps:
    - name: Evaluate hosted agent using native Foundry evaluators
      shell: bash
      env:
        EVAL_CONFIG: ${{ inputs.config }}
        MIN_PASS_RATE: ${{ inputs.minimum-pass-rate }}
      run: python "$GITHUB_ACTION_PATH/run_foundry_eval.py"
