name: Platform - build once and scan immutable image
on:
  workflow_call:
    inputs:
      agent_name:
        type: string
        required: true
    outputs:
      image_uri:
        description: 'ACR image URI pinned to a sha256 content digest'
        value: ${{ jobs.build.outputs.image_uri }}
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest # Use approved network-connected runner for private ACR.
    environment: build
    outputs:
      image_uri: ${{ steps.release.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Check protected release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Only main may release'; exit 1; }
      - name: Verify centrally owned contract
        uses: $/.github/actions/validate-hosted-agent
        with:
          agent_name: ${{ inputs.agent_name }}
      - name: Azure OIDC login for approved build identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          test -n "$ACR_NAME"
          az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Linux AMD64 image
        uses: docker/build-push-action@v6
        id: image
        with:
          context: ./src/agent
          file: ./src/agent/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/hosted-agents/${{ inputs.agent_name }}:${{ github.sha }}
      - name: Scan image for critical/high vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/hosted-agents/${{ inputs.agent_name }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Record artifact identity
        id: release
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          DIGEST: ${{ steps.image.outputs.digest }}
          AGENT_NAME: ${{ inputs.agent_name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ -n "$ACR_LOGIN_SERVER" ]] || exit 1
          echo "image_uri=${ACR_LOGIN_SERVER}/hosted-agents/${AGENT_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built immutable image ${ACR_LOGIN_SERVER}/hosted-agents/${AGENT_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
