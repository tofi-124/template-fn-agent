# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# APP-ONLY: connects to platform-owned Foundry project. Never add provisioning or network here.
name: sample-hosted-agent-project
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  sample-agent:
    host: azure.ai.agent
    uses: [ai-project]
    kind: hosted
    name: sample-hosted-agent
    description: Product-team hosted agent starter
    project: src/agent
    language: docker
    image: ${AGENT_IMAGE}
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      PYTHONNOUSERSITE: "1"
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
